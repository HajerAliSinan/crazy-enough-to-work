<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crazy Enough">
<meta name="theme-color" content="#EDF0F4">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crazy Enough to Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F4; --ink:#15181F; --card:#FFFFFF; --line:#D8DDE5;
  --muted:#69727F; --cobalt:#2545DC; --amber:#E3A008; --dim:#9AA3B0;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; align-items:center;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom)); gap:14px;
}
header{width:100%;max-width:560px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em}
#count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
#filter{
  width:100%;max-width:560px;font-family:var(--body);font-size:14px;color:var(--ink);
  padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.stage{width:100%;max-width:560px;flex:1;min-height:520px;perspective:1600px}
.card{position:relative;width:100%;height:100%;transition:transform .4s cubic-bezier(.4,.05,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:16px;padding:22px;display:flex;flex-direction:column;overflow-y:auto;
  box-shadow:0 1px 2px rgba(21,24,31,.06),0 10px 28px -12px rgba(21,24,31,.22);
}
.front{background:var(--card);border:1px solid var(--line)}
.back{background:var(--ink);color:#F2F4F8;transform:rotateY(180deg);border:1px solid var(--ink)}
.eyebrow{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.front .eyebrow{color:var(--muted)}
.back .eyebrow{color:var(--dim)}
.co{font-family:var(--display);font-weight:700;font-size:15px;margin:14px 0 4px;letter-spacing:-.01em}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--cobalt);text-transform:uppercase}
.back .tag{color:var(--amber)}
.q{font-family:var(--display);font-weight:500;font-size:clamp(21px,5.4vw,27px);line-height:1.28;margin:16px 0 0;letter-spacing:-.015em}
.a{font-size:16px;line-height:1.52;margin:16px 0 0;color:#E6E9EF}
.hint{margin-top:auto;padding-top:18px;font-size:12.5px;color:var(--muted)}
.take{margin-top:auto;padding-top:18px}
.take b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--amber);margin-bottom:5px}
.take span{font-size:14px;line-height:1.45;color:#C9CFDA}
.bar{width:100%;max-width:560px;display:flex;gap:8px}
button{
  flex:1;font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 8px;cursor:pointer;
}
button:active{background:#E4E8EE}
button:focus-visible,.card:focus-visible,#filter:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
#shuffle{flex:0 0 auto;padding:14px 18px;color:var(--cobalt)}
.empty{font-size:15px;color:var(--muted);text-align:center;margin:auto;padding:20px}
.media{margin:-22px -22px 14px;position:relative;min-height:120px;flex:0 0 auto;background:#20242E;display:flex;align-items:center;justify-content:center;padding-bottom:22px;border-radius:16px 16px 0 0;overflow:hidden}
.media img{display:block;max-width:100%;max-height:clamp(160px,32vh,260px);width:auto;height:auto;object-fit:contain}
.media.noimg{height:140px}
.media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:44px;color:#2F3546}
.media img+.ph{display:none}.media.noimg .ph{display:flex}
.cap{position:absolute;left:0;right:0;bottom:0;padding:5px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#C9CFDA;background:#1A1E27}
.links{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.links a{font-size:13.5px;line-height:1.4;color:var(--amber);text-decoration:none;border:1px solid #2F3546;border-radius:10px;padding:9px 11px}
.links a:hover,.links a:focus-visible{border-color:var(--amber)}
.links a small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:2px;text-transform:uppercase}
.back .take{margin-top:16px}

.score{width:100%;max-width:560px;display:flex;gap:8px}
.pl{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.pl b{font-family:var(--display);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl span{font-family:var(--mono);font-size:20px}
.pl.on{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt);background:#EEF1FD}
.turn{width:100%;max-width:560px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--cobalt)}
.judge{width:100%;max-width:560px;display:flex;gap:8px}
.judge button{font-weight:600}
#right{background:#1F7A4D;color:#fff;border-color:#1F7A4D}
#wrong{background:#B3261E;color:#fff;border-color:#B3261E}
#steal{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.overlay{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;overflow:auto}
.panel{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--display);margin:0;font-size:26px}
.panel label{font-size:12px;font-family:var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;gap:5px}
.panel input,.panel select{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-transform:none;letter-spacing:0;color:var(--ink);font-family:var(--body)}
.panel .row{display:flex;gap:8px}
.panel p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.primary{background:var(--cobalt);color:#fff;border-color:var(--cobalt);font-weight:600}
.hidden{display:none!important}
.mode{font-size:12px;color:var(--muted);background:none;border:none;padding:0;flex:0 0 auto;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>

<header>
  <h1>Crazy Enough to Work</h1>
  <span id="count"></span>
</header>

<div class="score hidden" id="score">
  <div class="pl" id="p0"><b id="n0"></b><span id="s0">0</span></div>
  <div class="pl" id="p1"><b id="n1"></b><span id="s1">0</span></div>
</div>
<div class="turn hidden" id="turn"></div>

<select id="filter" aria-label="Filter by category"></select>

<div class="stage">
  <div class="card" id="card" tabindex="0" role="button" aria-label="Card. Activate to flip."></div>
</div>

<div class="judge hidden" id="judge">
  <button id="right">✓ Right</button>
  <button id="wrong">✗ Wrong</button>
  <button id="steal" class="hidden"></button>
  <button id="nosteal" class="hidden">No steal · next</button>
</div>

<div class="bar" id="bar">
  <button id="prev">Previous</button>
  <button id="shuffle">Shuffle</button>
  <button id="next">Next</button>
</div>
<button class="mode" id="newgame">New 2-player game</button>

<div class="overlay" id="setup">
  <form class="panel" id="setupForm">
    <h2>Crazy Enough to Work</h2>
    <p>Origin stories, surprise pivots and history that shouldn't have worked. Take turns answering; flip to check.</p>
    <div class="row">
      <label style="flex:1">Player 1<input id="in0" placeholder="Player 1" maxlength="20"></label>
      <label style="flex:1">Player 2<input id="in1" placeholder="Player 2" maxlength="20"></label>
    </div>
    <label>Category<select id="setCat"></select></label>
    <label>Game ends
      <select id="endMode"><option value="cards">After a number of cards</option><option value="target">First to a target score</option><option value="deck">Play through the whole deck</option></select>
    </label>
    <label id="numWrap">Number<input id="endN" type="number" min="1" max="144" value="20"></label>
    <p>Wrong answer? The other player can <b>steal</b> the point.</p>
    <button type="submit" class="primary">Start game</button>
    <button type="button" id="solo">Just browse cards (single player)</button>
  </form>
</div>

<div class="overlay hidden" id="end">
  <div class="panel">
    <h2 id="winner"></h2>
    <p id="final"></p>
    <button class="primary" id="rematch">Rematch (same players)</button>
    <button id="again">New game</button>
    <button id="browse">Just browse cards</button>
  </div>
</div>

<script>
const CATS={A:"1990-1999: Internet Arrives",B:"2000-2005: Rebuild & Platforms",C:"2005-2010: Apps & Marketplaces",D:"2010-2015: Unicorn Era",E:"2015-2020: AI, SaaS & New Frontiers",F:"2020-2025: New AI Wave",G:"Founders & Origins",H:"Big Tech",I:"Health Tech",J:"Biotech & MedTech",K:"Politics & History",L:"Startup Strategy"};

/* One object per card. Category is derived from the id prefix via CATS. */
const CARDS=[
{i:"A-01",co:"Amazon",tg:"FOUNDERS",q:"Who founded Amazon?",a:"Jeff Bezos founded Amazon in 1994. It began as an online bookstore before expanding into a much broader marketplace and technology company.",t:"Start narrow; expansion can come later.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/260202-D-PM193-2205_SECWAR_Arsenal_of_Freedom_Tour_-_Florida_%283x4_cropped_on_Bezos_and_rotated%29.jpg/330px-260202-D-PM193-2205_SECWAR_Arsenal_of_Freedom_Tour_-_Florida_%283x4_cropped_on_Bezos_and_rotated%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Jeff Bezos · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Jeff_Bezos",v:"https://www.youtube.com/watch?v=cz3Y9rAM-hA",vt:"AMAZON CEO | Jeff Bezos Biography | Success Story | Startup Stories",vl:226},
{i:"A-02",co:"Amazon",tg:"ORIGIN STORY",q:"TRUE OR FALSE: Early Amazon employees sometimes worked at desks made from doors.",a:"TRUE. Bezos became known for inexpensive “door desks” - doors with legs attached - as a symbol of frugality and spending on customers rather than fancy furniture.",t:"Constraints can become culture.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/Amazon_Tower_I_topped_out%2C_June_2015.jpg/330px-Amazon_Tower_I_topped_out%2C_June_2015.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Amazon (company) · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Amazon_(company)",v:"https://www.youtube.com/watch?v=Bj9PRMHKDqk",vt:"From Scrappy DIY Desk to Amazon Icon | Amazon News",vl:80},
{i:"A-03",co:"Google",tg:"FOUNDERS",q:"Who founded Google?",a:"Larry Page and Sergey Brin, while graduate students at Stanford. They incorporated Google in 1998 after developing a new approach to ranking web pages.",t:"A technical insight can become a company.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/Larry_Page_in_the_European_Parliament%2C_17.06.2009_%28cropped_2%29.jpg/330px-Larry_Page_in_the_European_Parliament%2C_17.06.2009_%28cropped_2%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Larry Page · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Larry_Page",v:"https://www.youtube.com/watch?v=0-jJRE9tRcg",vt:"The crazy life of Google founder Sergey Brin",vl:74},
{i:"A-04",co:"Google",tg:"WHAT WAS IT CALLED?",q:"Before it was called Google, what was Page and Brin’s search project called? A) WebCrawler B) BackRub C) PageRanker D) AltaVista",a:"B) BackRub. The name referred to analyzing links pointing back to web pages. The ranking concept became the foundation of Google Search.",t:"Good products can begin with terrible names.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Google_page_brin.jpg/330px-Google_page_brin.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"History of Google · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/History_of_Google",v:"https://www.youtube.com/watch?v=OrT1rs6PVG8",vt:"The Complete History of Google | From BackRub to the World's Biggest Tech Company (1995–2026)",vl:238},
{i:"A-05",co:"eBay",tg:"FOUNDERS",q:"Who founded eBay?",a:"Pierre Omidyar founded the company in 1995. It was originally called AuctionWeb.",t:"Marketplaces can begin as tiny experiments.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Pomidyarji_%28cropped%29.jpg/330px-Pomidyarji_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Pierre Omidyar · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Pierre_Omidyar",v:"https://www.youtube.com/watch?v=MBSeC-M_hw8",vt:"eBay|History of eBay|Pierre Omidyar|Auctionweb|eBay.com|echobay.com|",vl:335},
{i:"A-06",co:"eBay",tg:"WEIRD BUT TRUE",q:"One of the first items sold on eBay was a broken laser pointer. True or false?",a:"TRUE. Omidyar reportedly contacted the buyer to make sure he knew it was broken; the buyer said he collected broken laser pointers.",t:"A strange first customer can validate a real market.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/EBay_logo.svg/330px-EBay_logo.svg.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"EBay · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/EBay",v:"https://www.youtube.com/watch?v=n7tq4EiGkA4",vt:"Meet the Buyer Behind eBay Founder Pierre Omidyar's First Ever Sale",vl:124},
{i:"A-07",co:"Netflix",tg:"FOUNDERS",q:"Who founded Netflix?",a:"Reed Hastings and Marc Randolph founded Netflix in 1997. The original business was DVD rental by mail, not streaming.",t:"Today’s business model may not be the final one.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Re_publica_2015_-_Tag_1_%2817381870955%29_%28cropped%29.jpg/330px-Re_publica_2015_-_Tag_1_%2817381870955%29_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Reed Hastings · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Reed_Hastings",v:"https://www.youtube.com/watch?v=wEMPbG__R8A",vt:"The idea that became Netflix",vl:228},
{i:"A-08",co:"Netflix",tg:"PIVOT",q:"Which came first for Netflix? A) Streaming B) DVD-by-mail subscriptions C) Original TV shows D) Movie theaters",a:"B) DVD-by-mail subscriptions. Streaming was added years later, and original programming came later still.",t:"Capabilities compound across pivots.",img:"https://thumb.wikimedia.org/wikipedia/en/thumb/3/3c/Netflix_UI_for_Web.png/330px-Netflix_UI_for_Web.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Netflix · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Netflix",v:"https://www.youtube.com/watch?v=n7Vz-saGwjU",vt:"Long Live the Red Envelope Era | Farewell to DVDs | Netflix",vl:74},
{i:"A-09",co:"PayPal",tg:"MERGER STORY",q:"PayPal’s early story involved a merger between Confinity and which Elon Musk-founded company? A) Zip2 B) X.com C) SolarCity D) The Boring Company",a:"B) X.com. Confinity, which had developed PayPal, merged with Musk’s X.com in 2000; the combined company later took the PayPal name.",t:"Competitors can become one company.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/PayPal_San_Jose_Headquarters.jpg/330px-PayPal_San_Jose_Headquarters.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"PayPal · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/PayPal",v:"https://www.youtube.com/watch?v=7vljg4LAAL4",vt:"From Confinity to Currency: The Untold Story of PayPal",vl:114},
{i:"A-10",co:"Salesforce",tg:"FOUNDERS",q:"Who is the founder most associated with Salesforce?",a:"Marc Benioff co-founded Salesforce in 1999 with Parker Harris, Dave Moellenhoff and Frank Dominguez.",t:"Enterprise startups can be category creators.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Marc_Benioff.jpg/330px-Marc_Benioff.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Marc Benioff · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Marc_Benioff",v:"https://www.youtube.com/watch?v=Yyum2Ox2ZuE",vt:"Salesforce founded 1999 by Marc Benioff",vl:61},
{i:"A-11",co:"Alibaba",tg:"ORIGIN STORY",q:"Where did Jack Ma and his co-founders start Alibaba? A) A university lab B) A Hangzhou apartment C) A bank office D) A factory",a:"B) A Hangzhou apartment. Alibaba was founded in 1999 by Jack Ma and a group of co-founders.",t:"Large networks can start in small rooms.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/20th_Anniversary_Schwab_Foundation_Gala_Dinner_%2844887783681%29_%28cropped%29.jpg/330px-20th_Anniversary_Schwab_Foundation_Gala_Dinner_%2844887783681%29_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Jack Ma · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Jack_Ma",v:"https://www.youtube.com/watch?v=1FZ8prxJG2o",vt:"Jack Ma's Alibaba Proving Ground: An Apartment? | CNBC",vl:165},
{i:"A-12",co:"NVIDIA",tg:"FOUNDERS",q:"Who founded NVIDIA?",a:"Jensen Huang, Chris Malachowsky and Curtis Priem founded NVIDIA in 1993.",t:"Deep-tech companies may take decades to reach their biggest market.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Jen-Hsun_Huang_2025.jpg/330px-Jen-Hsun_Huang_2025.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Jensen Huang · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Jensen_Huang",v:"https://www.youtube.com/watch?v=WTuUExKW1OY",vt:"The Rise of Jensen Huang, NVIDIA’s Co-founder, President & CEO",vl:422},
{i:"B-01",co:"SpaceX",tg:"FOUNDERS",q:"Who founded SpaceX?",a:"Elon Musk founded SpaceX in 2002 with the goal of reducing space transportation costs and ultimately enabling human life beyond Earth.",t:"Mission can attract talent to hard problems.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Starship_-_Flight_13_%28Sunset%29.jpg/330px-Starship_-_Flight_13_%28Sunset%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"SpaceX · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/SpaceX",v:"https://www.youtube.com/watch?v=y-tlQAUdP48",vt:"SpaceX Full Story in 5 Minutes (2002–2026) | From Bankruptcy to Starship & Mars",vl:301},
{i:"B-02",co:"Tesla",tg:"FOUNDERS",q:"Who founded Tesla?",a:"Tesla was founded in 2003 by Martin Eberhard and Marc Tarpenning. Elon Musk joined as an early investor and chairman; JB Straubel and Ian Wright were also later recognized as co-founders.",t:"Startup origin stories can be more complicated than the famous CEO.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/Martin_Eberhard_%28cropped%29.jpg/330px-Martin_Eberhard_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Martin Eberhard · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Martin_Eberhard",v:"https://www.youtube.com/watch?v=YmGnRbcDDuc",vt:"Elon Musk states how Tesla was founded",vl:525},

{i:"B-04",co:"Facebook / Meta",tg:"FOUNDERS",q:"Who founded Facebook?",a:"Mark Zuckerberg launched Facebook in 2004 with fellow Harvard students and collaborators including Eduardo Saverin, Andrew McCollum, Dustin Moskovitz and Chris Hughes.",t:"Founding teams often evolve quickly.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/P20260929DT-1655_%2855561811540%29_%28cropped_2%29.jpg/330px-P20260929DT-1655_%2855561811540%29_%28cropped_2%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Mark Zuckerberg · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Mark_Zuckerberg",v:"https://www.youtube.com/watch?v=gsefnhTK5lc",vt:"Watch the moment Mark Zuckerberg got into Harvard",vl:62},

{i:"C-01",co:"Airbnb",tg:"FOUNDERS",q:"Who founded Airbnb?",a:"Brian Chesky, Joe Gebbia and Nathan Blecharczyk founded Airbnb. Chesky and Gebbia first hosted guests in their San Francisco apartment in 2007.",t:"Memorize the people - then learn the story.",img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Brian_Chesky_2025.jpg/330px-Brian_Chesky_2025.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail",cap:"Brian Chesky · Wikipedia / Wikimedia Commons",w:"https://en.wikipedia.org/wiki/Brian_Chesky",v:"https://www.youtube.com/watch?v=ES2EldfdbiY",vt:"Brian Chesky On How AirBnb Got Its First Round Of Funding",vl:215},

const el=id=>document.getElementById(id);
const cardEl=el("card"), countEl=el("count"), filterEl=el("filter");
let deck=CARDS.slice(), idx=0;
const cat=c=>CATS[c.i.split("-")[0]];
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const attr=s=>esc(s).replace(/"/g,"&quot;");
const KEY="cetw_game_v1";
let G=null; // game state
const opts='<option value="">All categories · 144 cards</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
filterEl.innerHTML=opts; el("setCat").innerHTML=opts;
const byCat=v=>v?CARDS.filter(c=>c.i.startsWith(v+"-")):CARDS.slice();
const shuf=a=>{for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}return a;};
const save=()=>{ try{ if(G&&G.on)localStorage.setItem(KEY,JSON.stringify(G)); else localStorage.removeItem(KEY);}catch(e){} };

function render(){
  cardEl.classList.remove("flipped");
  if(!deck.length){
    countEl.textContent="0 cards";
    cardEl.innerHTML='<div class="face front"><p class="empty">No cards in this category yet. Pick another one.</p></div>';
    return;
  }
  const c=deck[idx];
  countEl.textContent=G&&G.on?`Card ${G.played+1}${G.mode==="cards"?" / "+G.limit:G.mode==="deck"?" / "+deck.length:""}`:`Card ${idx+1} / ${deck.length}`;
  cardEl.innerHTML=`
    <div class="face front">
      <div class="eyebrow"><span>${esc(cat(c))}</span><span>${c.i}</span></div>
      <div class="co">${esc(c.co)}</div><div class="tag">${esc(c.tg)}</div>
      <h2 class="q">${esc(c.q)}</h2>
      <p class="hint">${G&&G.on?esc(G.names[G.cur])+", guess first. Tap the card to flip.":"Guess first. Tap the card to flip."}</p>
    </div>
    <div class="face back">
      <div class="media${c.img?"":" noimg"}">${c.img?`<img src="${c.img}" alt="${attr(c.cap?c.cap.split(" · ")[0]:c.co)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg');this.remove()">`:""}<div class="ph">${esc(c.co.charAt(0))}</div>${c.img?`<div class="cap">${esc(c.cap)}</div>`:""}</div>
      <div class="eyebrow"><span>Answer + why it matters</span><span>${c.i}</span></div>
      <div class="co">${esc(c.co)}</div><div class="tag">${esc(c.tg)}</div>
      <p class="a">${esc(c.a)}</p>
      <div class="take"><b>Takeaway</b><span>${esc(c.t)}</span></div>
      <div class="links">${c.v?`<a href="${c.v}" target="_blank" rel="noopener"><small>Watch · YouTube${c.vl?" · "+Math.floor(c.vl/60)+":"+String(c.vl%60).padStart(2,"0"):""}</small>Watch: ${esc(c.vt)}</a>`:""}${c.w?`<a href="${c.w}" target="_blank" rel="noopener"><small>${c.v?"Read more":"No video found · read instead"} · Wikipedia</small>${esc(decodeURIComponent(c.w.split("/wiki/")[1]).replace(/_/g," "))}</a>`:""}</div>
    </div>`;
}

const flip=()=>{ if(!deck.length)return; if(G&&G.on&&G.phase!=="ask"&&G.phase!=="judge")return; cardEl.classList.toggle("flipped"); if(G&&G.on&&cardEl.classList.contains("flipped")){G.phase="judge";} ui(); };
const go=n=>{ if(!deck.length)return; idx=(idx+n+deck.length)%deck.length; render(); ui(); };

function ui(){
  const on=G&&G.on;
  el("score").classList.toggle("hidden",!on); el("turn").classList.toggle("hidden",!on);
  el("bar").classList.toggle("hidden",!!on); filterEl.classList.toggle("hidden",!!on);
  el("newgame").textContent=on?"Quit game · browse":"New 2-player game";
  const fl=cardEl.classList.contains("flipped");
  el("judge").classList.toggle("hidden",!(on&&fl));
  if(!on)return;
  for(const p of [0,1]){el("n"+p).textContent=G.names[p];el("s"+p).textContent=G.score[p];el("p"+p).classList.toggle("on",p===(G.phase==="steal"?1-G.cur:G.cur));}
  const other=G.names[1-G.cur];
  el("turn").textContent=G.phase==="steal"?`${other}: steal it?`:`${G.names[G.cur]}'s turn`+(G.mode==="target"?` · first to ${G.limit}`:"");
  const st=G.phase==="steal";
  el("right").classList.toggle("hidden",st); el("wrong").classList.toggle("hidden",st);
  el("steal").classList.toggle("hidden",!st); el("nosteal").classList.toggle("hidden",!st);
  el("steal").textContent=`${other} steals (+1)`;
}
function startGame(names,catv,mode,n){
  const d=shuf(byCat(catv));
  G={on:true,names,cat:catv,mode,limit:mode==="cards"?Math.min(n,d.length):n,order:d.map(c=>c.i),pos:0,played:0,cur:0,score:[0,0],phase:"ask",log:[]};
  loadGame(); save();
}
function loadGame(){
  const m=Object.fromEntries(CARDS.map(c=>[c.i,c]));
  deck=G.order.map(i=>m[i]).filter(Boolean); idx=G.pos;
  el("setup").classList.add("hidden"); el("end").classList.add("hidden");
  render(); if(G.phase!=="ask")cardEl.classList.add("flipped"); ui();
}
function finished(){
  if(G.mode==="target")return G.score[0]>=G.limit||G.score[1]>=G.limit||G.played>=deck.length;
  if(G.mode==="cards")return G.played>=G.limit;
  return G.played>=deck.length;
}
function nextTurn(){
  G.played++; G.pos=(G.pos+1)%deck.length; G.cur=1-G.cur; G.phase="ask"; idx=G.pos;
  if(finished()){ endGame(); return; }
  save(); render(); ui();
}
function endGame(){
  G.on=false; save(); G.on=true; // keep data for rematch without persisting
  const [a,b]=G.score, w=a===b?"It's a tie!":`${G.names[a>b?0:1]} wins!`;
  el("winner").textContent=w;
  el("final").textContent=`${G.names[0]} ${a} – ${b} ${G.names[1]} · ${G.played} cards played`;
  el("end").classList.remove("hidden");
}
const award=p=>{G.score[p]++;};
const stop=f=>e=>{e.stopPropagation();f();};
el("right").addEventListener("click",stop(()=>{ if(!G||G.phase!=="judge")return; award(G.cur); nextTurn(); }));
el("wrong").addEventListener("click",stop(()=>{ if(!G||G.phase!=="judge")return; G.phase="steal"; save(); ui(); }));
el("steal").addEventListener("click",stop(()=>{ if(!G||G.phase!=="steal")return; award(1-G.cur); nextTurn(); }));
el("nosteal").addEventListener("click",stop(()=>{ if(!G||G.phase!=="steal")return; nextTurn(); }));

cardEl.addEventListener("click",e=>{ if(e.target.closest("a"))return; flip(); });
cardEl.addEventListener("keydown",e=>{ if(e.target.closest&&e.target.closest("a"))e.stopPropagation(); },true);
cardEl.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();} });
el("next").addEventListener("click",()=>go(1));
el("prev").addEventListener("click",()=>go(-1));
el("shuffle").addEventListener("click",()=>{ shuf(deck); idx=0; render(); ui(); });
filterEl.addEventListener("change",()=>{ deck=byCat(filterEl.value); idx=0; render(); ui(); });
document.addEventListener("keydown",e=>{
  if(G&&G.on)return; if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")go(1); else if(e.key==="ArrowLeft")go(-1);
});
const syncN=()=>{ el("numWrap").classList.toggle("hidden",el("endMode").value==="deck"); el("endN").value=el("endMode").value==="target"?(el("endN").value==20?10:el("endN").value):el("endN").value; };
el("endMode").addEventListener("change",syncN);
const showSetup=()=>{ el("end").classList.add("hidden"); el("setup").classList.remove("hidden"); };
el("setupForm").addEventListener("submit",e=>{
  e.preventDefault();
  const names=[el("in0").value.trim()||"Player 1",el("in1").value.trim()||"Player 2"];
  startGame(names,el("setCat").value,el("endMode").value,Math.max(1,parseInt(el("endN").value)||20));
});
const browse=()=>{ G=null; save(); el("setup").classList.add("hidden"); el("end").classList.add("hidden"); deck=byCat(filterEl.value); idx=0; render(); ui(); };
el("solo").addEventListener("click",browse);
el("browse").addEventListener("click",browse);
el("rematch").addEventListener("click",()=>startGame(G.names,G.cat,G.mode,G.limit));
el("again").addEventListener("click",()=>{ if(G){el("in0").value=G.names[0];el("in1").value=G.names[1];} G=null; save(); showSetup(); });
el("newgame").addEventListener("click",()=>{ if(G&&G.on){ if(confirm("Quit this game?"))browse(); } else showSetup(); });

render(); ui();
try{ const g=JSON.parse(localStorage.getItem(KEY)||"null"); if(g&&g.on&&g.order){G=g;loadGame();} }catch(e){}
</script>
</body>
</html>
